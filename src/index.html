<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <ul id="messages"></ul>

    <form id="form">
      <input
        id="input"
        type="text"
        placeholder="Écris un message…"
        aria-label="Message"
        autocomplete="off"
        autofocus
        required
      />

      <button type="submit" aria-label="Envoyer">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m22 2-7 20-4-9-9-4Z" />
          <path d="M22 2 11 13" />
        </svg>
      </button>
    </form>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const button = form.querySelector("button");

      const pseudo = (prompt("Entre ton pseudo") || "").trim() || "Anonyme";

      // Identifiant propre à cet onglet, conservé entre les reconnexions
      const clientId =
        sessionStorage.getItem("clientId") ??
        crypto.randomUUID?.() ??
        Math.random().toString(36).slice(2);
      sessionStorage.setItem("clientId", clientId);

      // Créé après pseudo et clientId, car ils partent dans auth
      const socket = io({
        auth: { serverOffset: 0, pseudo, clientId },
        ackTimeout: 10000,
        retries: 3,
      });

      button.disabled = true;

      function scrollToBottom() {
        window.scrollTo(0, document.body.scrollHeight);
      }

      function formatTime(timestamp) {
        return new Date(timestamp).toLocaleTimeString("fr-FR", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function addMessage(msg) {
        const li = document.createElement("li");
        const isMine = msg.clientId === clientId;
        li.className = isMine ? "mine" : "other";

        // Le pseudo n'est affiché que pour les messages des autres
        if (!isMine) {
          const strong = document.createElement("strong");
          strong.textContent = msg.pseudo;
          li.append(strong);
        }

        const span = document.createElement("span");
        span.textContent = msg.text;
        li.append(span);

        const time = document.createElement("time");
        time.textContent = formatTime(msg.createdAt);
        li.append(time);

        messages.appendChild(li);
        scrollToBottom();

        // Prochaine reconnexion : on repart de ce message
        socket.auth.serverOffset = msg.id;
      }

      function addSystemMessage(text) {
        const li = document.createElement("li");
        li.className = "system";
        li.textContent = text;
        messages.appendChild(li);
        scrollToBottom();
      }

      input.addEventListener("input", () => {
        button.disabled = input.value.trim() === "";
      });

      let counter = 0;

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const text = input.value.trim();
        if (text) {
          // Identifiant unique de ce message, pour que le serveur ignore les doublons
          const clientOffset = `${clientId}-${Date.now()}-${counter++}`;
          socket.emit("chat message", text, clientOffset);

          input.value = "";
          button.disabled = true;
          input.focus();
        }
      });

      socket.on("chat message", addMessage);
      socket.on("system message", addSystemMessage);
    </script>
  </body>
</html>
